<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>تدرّب على نطق الصينية</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600&family=Noto+Sans+SC:wght@400;500;700&family=Nunito:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>

/* ── Reset ─────────────────────────────────────────────────── */
*, *::before, *::after {
  margin: 0; padding: 0;
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

/* ── Design tokens ──────────────────────────────────────────── */
:root {
  /* Brand */
  --indigo:        #6366f1;
  --indigo-mid:    #818cf8;
  --indigo-light:  #c7d2fe;
  --indigo-xlight: #eef2ff;
  --violet:        #7c3aed;
  --violet-mid:    #a78bfa;

  /* Semantic */
  --green:   #10b981;
  --amber:   #f59e0b;
  --rose:    #f43f5e;

  /* Neutrals */
  --ink:     #1e1b4b;   /* deepest text */
  --slate:   #475569;   /* body text */
  --muted:   #94a3b8;   /* secondary text */
  --line:    #e2e8f0;   /* dividers */
  --surface: #ffffff;

  /* Card */
  --card-radius: 28px;
  --card-shadow: 0 4px 6px -1px rgba(99,102,241,.07),
                 0 20px 50px -12px rgba(99,102,241,.18);

  /* Fonts */
  --font-ar: "IBM Plex Sans Arabic", "Noto Sans Arabic", sans-serif;
  --font-zh: "Noto Sans SC", sans-serif;
  --font-py: "Nunito", sans-serif;   /* rounded — great for pinyin tones */
}

/* ── Base ───────────────────────────────────────────────────── */
html, body { height: 100%; }

body {
  font-family: var(--font-ar);
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px 16px 32px;
  overflow-x: hidden;
  position: relative;

  /* Soft blue-violet gradient background */
  background:
    radial-gradient(ellipse 80% 60% at 10% 0%,   #ddd6fe55 0%, transparent 60%),
    radial-gradient(ellipse 60% 50% at 90% 100%,  #bfdbfe44 0%, transparent 60%),
    linear-gradient(160deg, #f5f3ff 0%, #eff6ff 50%, #f0f9ff 100%);
}

/* Subtle noise texture overlay */
body::before {
  content: '';
  position: fixed; inset: 0;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");
  pointer-events: none; z-index: 0;
}

/* ── Layout ─────────────────────────────────────────────────── */
.page-wrap {
  position: relative; z-index: 1;
  width: 100%; max-width: 420px;
  display: flex; flex-direction: column; align-items: center; gap: 16px;
}

/* ── Brand bar ──────────────────────────────────────────────── */
.brand {
  display: flex; align-items: center; gap: 7px;
}
.brand-pulse {
  width: 7px; height: 7px; border-radius: 50%;
  background: var(--indigo);
  box-shadow: 0 0 0 0 rgba(99,102,241,.4);
  animation: pulse-ring 2.4s ease-in-out infinite;
}
@keyframes pulse-ring {
  0%,100% { box-shadow: 0 0 0 0   rgba(99,102,241,.4); }
  50%      { box-shadow: 0 0 0 6px rgba(99,102,241,0);  }
}
.brand-name {
  font-size: 12px; font-weight: 500; letter-spacing: .5px;
  color: var(--muted); text-transform: uppercase;
  font-family: var(--font-py);
}

/* ── Card ───────────────────────────────────────────────────── */
.card {
  width: 100%;
  background: var(--surface);
  border-radius: var(--card-radius);
  box-shadow: var(--card-shadow);
  border: 1px solid rgba(99,102,241,.08);
  overflow: hidden;
  position: relative;
}

/* Accent stripe across the top */
.card-stripe {
  height: 3px;
  background: linear-gradient(90deg, var(--indigo) 0%, var(--violet-mid) 50%, var(--indigo-mid) 100%);
  background-size: 200% 100%;
  animation: stripe-scroll 4s linear infinite;
}
@keyframes stripe-scroll {
  0%   { background-position: 0%   0%; }
  100% { background-position: 200% 0%; }
}

.card-body { padding: 24px 22px 22px; }

/* ── Header ─────────────────────────────────────────────────── */
.header { text-align: center; margin-bottom: 18px; }

.title {
  font-size: 20px; font-weight: 600;
  color: var(--ink); line-height: 1.35;
  letter-spacing: -.2px;
}
.subtitle {
  margin-top: 4px;
  font-size: 11px; font-weight: 500; letter-spacing: .6px;
  color: var(--muted); text-transform: uppercase;
  font-family: var(--font-py);
  direction: ltr;
}

/* ── Progress pills ─────────────────────────────────────────── */
.progress {
  display: flex; justify-content: center;
  gap: 5px; margin-bottom: 18px; flex-wrap: wrap;
}
.progress-dot {
  width: 20px; height: 3px; border-radius: 2px;
  background: var(--line);
  transition: background .3s, width .3s;
}
.progress-dot.done   { background: var(--indigo-light); }
.progress-dot.active { background: var(--indigo); width: 28px; }

/* ── Sentence box ───────────────────────────────────────────── */
.sentence-box {
  background: var(--indigo-xlight);
  border: 1px solid rgba(99,102,241,.1);
  border-radius: 18px;
  padding: 22px 18px 16px;
  text-align: center;
  margin-bottom: 16px;
  transition: opacity .25s, transform .25s;
}
.sentence-box.changing { opacity: 0; transform: translateY(8px); }

.chinese {
  font-family: var(--font-zh);
  font-size: 36px; font-weight: 500;
  color: var(--ink);
  direction: ltr; letter-spacing: 3px;
  line-height: 1.3; margin-bottom: 8px;
}
.pinyin {
  font-family: var(--font-py);
  font-size: 15px; font-weight: 600;
  color: var(--indigo);
  direction: ltr; letter-spacing: .4px;
  margin-bottom: 10px; line-height: 1.4;
}
.arabic-meaning {
  font-size: 14px; font-weight: 400;
  color: var(--slate);
  padding-top: 10px;
  border-top: 1px solid rgba(99,102,241,.1);
  line-height: 1.5;
}

/* Hint row */
.hint-row {
  display: flex; align-items: flex-start; gap: 5px;
  margin-top: 11px; padding-top: 10px;
  border-top: 1px dashed rgba(99,102,241,.12);
  direction: ltr; text-align: left;
}
.hint-icon { font-size: 11px; flex-shrink: 0; margin-top: 2px; opacity: .65; }
.hint-text {
  font-family: var(--font-py);
  font-size: 11.5px; color: var(--muted);
  line-height: 1.6;
}
.hint-text strong { color: var(--indigo); font-weight: 600; }

/* ── Listen button ──────────────────────────────────────────── */
.listen-btn {
  width: 100%;
  display: flex; align-items: center; justify-content: center; gap: 8px;
  padding: 13px 16px;
  background: var(--surface);
  border: 1.5px solid var(--line);
  border-radius: 14px;
  color: var(--slate);
  font-family: var(--font-ar);
  font-size: 14px; font-weight: 500;
  cursor: pointer;
  transition: border-color .2s, background .2s, box-shadow .2s, color .2s;
  margin-bottom: 18px;
}
.listen-btn svg { width: 17px; height: 17px; flex-shrink: 0; }
.listen-btn:hover {
  border-color: var(--indigo-mid);
  color: var(--indigo);
  box-shadow: 0 2px 12px rgba(99,102,241,.12);
}
.listen-btn.playing {
  background: var(--indigo);
  border-color: var(--indigo);
  color: #fff;
  box-shadow: 0 4px 20px rgba(99,102,241,.35);
}
.sound-waves {
  display: inline-flex; align-items: center; gap: 2px; height: 14px;
}
.sound-waves span {
  width: 2.5px; background: currentColor; border-radius: 2px;
  animation: sw .9s ease-in-out infinite;
}
.sound-waves span:nth-child(1) { height: 5px;  animation-delay: 0s; }
.sound-waves span:nth-child(2) { height: 11px; animation-delay: .12s; }
.sound-waves span:nth-child(3) { height: 7px;  animation-delay: .24s; }
.sound-waves span:nth-child(4) { height: 13px; animation-delay: .08s; }
@keyframes sw {
  0%,100% { transform: scaleY(.35); }
  50%      { transform: scaleY(1);   }
}

/* ── Mic section ────────────────────────────────────────────── */
.mic-section {
  display: flex; flex-direction: column; align-items: center;
  gap: 0; margin-bottom: 16px;
}

/* Status text */
.mic-status { min-height: 44px; text-align: center; margin-bottom: 12px; }
.mic-status-ar {
  font-size: 13px; font-weight: 500; color: var(--muted);
  line-height: 1.5; transition: color .3s;
}
.mic-status-zh {
  font-family: var(--font-py);
  font-size: 11px; color: var(--muted);
  direction: ltr; transition: color .3s;
}

/* Soundwave bar */
.soundwave-bar {
  display: flex; align-items: center; justify-content: center;
  gap: 3px; overflow: hidden;
  height: 0; transition: height .3s, margin .3s;
}
.soundwave-bar.active { height: 26px; margin-bottom: 10px; }
.soundwave-bar .bar {
  width: 3px; border-radius: 2px;
  background: var(--rose);
  animation: sbWave .85s ease-in-out infinite;
}
.soundwave-bar .bar:nth-child(1)  { height: 7px;  animation-delay: .00s; }
.soundwave-bar .bar:nth-child(2)  { height: 15px; animation-delay: .09s; }
.soundwave-bar .bar:nth-child(3)  { height: 22px; animation-delay: .18s; }
.soundwave-bar .bar:nth-child(4)  { height: 26px; animation-delay: .04s; }
.soundwave-bar .bar:nth-child(5)  { height: 17px; animation-delay: .13s; }
.soundwave-bar .bar:nth-child(6)  { height: 24px; animation-delay: .27s; }
.soundwave-bar .bar:nth-child(7)  { height: 13px; animation-delay: .07s; }
.soundwave-bar .bar:nth-child(8)  { height: 19px; animation-delay: .22s; }
.soundwave-bar .bar:nth-child(9)  { height: 9px;  animation-delay: .16s; }
.soundwave-bar .bar:nth-child(10) { height: 5px;  animation-delay: .31s; }
@keyframes sbWave {
  0%,100% { transform: scaleY(.25); opacity: .6; }
  50%      { transform: scaleY(1);   opacity: 1;  }
}

/* ── Mic button ─────────────────────────────────────────────── */
.mic-btn {
  width: 104px; height: 104px;
  border-radius: 50%;
  border: none;
  background: linear-gradient(145deg, var(--indigo), var(--violet));
  color: #fff;
  cursor: pointer;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 4px;
  position: relative;
  box-shadow:
    0 8px 20px rgba(99,102,241,.38),
    0 2px 6px  rgba(99,102,241,.2);
  transition: transform .25s cubic-bezier(.34,1.56,.64,1),
              box-shadow .25s ease;
  user-select: none;
}
/* Ring halos */
.mic-btn::before, .mic-btn::after {
  content: ''; position: absolute; border-radius: 50%; pointer-events: none;
}
.mic-btn::before {
  inset: -7px;
  border: 2px solid rgba(99,102,241,.18);
  transition: inset .3s, opacity .3s;
}
.mic-btn::after {
  inset: -16px;
  border: 1px solid rgba(99,102,241,.08);
  transition: inset .3s, opacity .3s;
}
.mic-btn:hover {
  transform: scale(1.06);
  box-shadow: 0 12px 32px rgba(99,102,241,.45), 0 4px 10px rgba(99,102,241,.22);
}
.mic-btn:active { transform: scale(.97); }

.mic-btn-icon  { font-size: 26px; line-height: 1; }
.mic-btn-label {
  font-family: var(--font-py);
  font-size: 9.5px; font-weight: 600;
  opacity: .88; letter-spacing: .2px; text-align: center;
}

/* Recording state */
.mic-btn.recording {
  background: linear-gradient(145deg, #f43f5e, #fb7185);
  box-shadow: 0 8px 20px rgba(244,63,94,.42), 0 2px 6px rgba(244,63,94,.2);
  animation: micPulse 1.5s ease-in-out infinite;
}
.mic-btn.recording::before { animation: halo1 1.5s ease-out infinite; border-color: rgba(244,63,94,.35); }
.mic-btn.recording::after  { animation: halo2 1.5s ease-out .35s infinite; border-color: rgba(244,63,94,.15); }
@keyframes micPulse {
  0%,100% { box-shadow: 0 8px 20px rgba(244,63,94,.4);  }
  50%      { box-shadow: 0 8px 36px rgba(244,63,94,.65); }
}
@keyframes halo1 {
  0%   { inset: -6px;  opacity: 1; }
  100% { inset: -22px; opacity: 0; }
}
@keyframes halo2 {
  0%   { inset: -10px; opacity: .7; }
  100% { inset: -32px; opacity: 0;  }
}

/* Analyzing state */
.mic-btn.analyzing {
  background: linear-gradient(145deg, #f59e0b, #fbbf24);
  box-shadow: 0 8px 20px rgba(245,158,11,.38);
  pointer-events: none;
  animation: analyzeGlow 1s ease-in-out infinite;
}
.mic-btn.analyzing::before { border-color: rgba(245,158,11,.3); animation: haloAmber 1s ease-out infinite; }
.mic-btn.analyzing::after  { opacity: 0; }
@keyframes analyzeGlow {
  0%,100% { transform: scale(1);    }
  50%      { transform: scale(1.03); }
}
@keyframes haloAmber {
  0%   { inset: -4px;  opacity: 1; }
  100% { inset: -20px; opacity: 0; }
}

/* Error state */
.mic-btn.error {
  background: linear-gradient(145deg, #ef4444, #f87171);
  box-shadow: 0 8px 20px rgba(239,68,68,.38);
  animation: shake .45s ease;
}
@keyframes shake {
  0%,100% { transform: translateX(0); }
  20%      { transform: translateX(-5px); }
  40%      { transform: translateX(5px); }
  60%      { transform: translateX(-3px); }
  80%      { transform: translateX(3px); }
}

/* ── Feedback card ──────────────────────────────────────────── */
.feedback { margin-bottom: 14px; }

.feedback-card {
  width: 100%;
  border-radius: 18px;
  padding: 18px 16px 14px;
  opacity: 0;
  transform: translateY(12px) scale(.98);
  transition: opacity .38s cubic-bezier(.16,1,.3,1),
              transform .38s cubic-bezier(.16,1,.3,1);
  pointer-events: none;
}
.feedback-card.show { opacity: 1; transform: none; pointer-events: auto; }

.feedback-card.excellent { background: #ecfdf5; border: 1.5px solid #a7f3d0; }
.feedback-card.good      { background: var(--indigo-xlight); border: 1.5px solid var(--indigo-light); }
.feedback-card.try-again { background: #fffbeb; border: 1.5px solid #fde68a; }

/* Score row */
.fb-top {
  display: flex; align-items: center; justify-content: center;
  gap: 10px; margin-bottom: 8px;
}
.fb-score {
  font-family: var(--font-py);
  font-size: 48px; font-weight: 700; line-height: 1;
  letter-spacing: -1px; direction: ltr;
}
.excellent .fb-score { color: var(--green); }
.good      .fb-score { color: var(--indigo); }
.try-again .fb-score { color: var(--amber); }

.fb-emoji {
  font-size: 28px; line-height: 1;
  animation: popIn .4s cubic-bezier(.34,1.56,.64,1) both;
}
@keyframes popIn {
  from { transform: scale(.2) rotate(-15deg); opacity: 0; }
  to   { transform: none; opacity: 1; }
}

/* Praise text */
.fb-praise-zh {
  font-family: var(--font-zh);
  font-size: 13.5px; font-weight: 500;
  color: var(--ink); direction: ltr;
  text-align: center; margin-bottom: 2px;
}
.fb-praise-ar {
  font-size: 12.5px; font-weight: 400;
  color: var(--slate); text-align: center;
  margin-bottom: 12px; line-height: 1.5;
}

/* Char bubbles */
.fb-chars {
  display: flex; justify-content: center;
  flex-wrap: wrap; gap: 7px;
  direction: ltr; margin-bottom: 10px;
}
.fb-char {
  display: flex; flex-direction: column; align-items: center; gap: 2px;
  animation: charIn .3s cubic-bezier(.16,1,.3,1) both;
}
@keyframes charIn {
  from { transform: translateY(6px); opacity: 0; }
  to   { transform: none; opacity: 1; }
}
.fb-char-py {
  font-family: var(--font-py);
  font-size: 10px; font-weight: 600; line-height: 1; letter-spacing: .2px;
}
.fb-char-hz {
  font-family: var(--font-zh);
  font-size: 22px; font-weight: 500; line-height: 1;
  padding: 4px 7px; border-radius: 8px;
}
.fb-char.ok   .fb-char-py { color: #059669; }
.fb-char.ok   .fb-char-hz { color: #065f46; background: #d1fae5; }
.fb-char.near .fb-char-py { color: #d97706; }
.fb-char.near .fb-char-hz { color: #92400e; background: #fef3c7; }
.fb-char.miss .fb-char-py { color: #dc2626; }
.fb-char.miss .fb-char-hz { color: #991b1b; background: #fee2e2; }

/* Legend */
.fb-legend {
  display: flex; justify-content: center; gap: 12px;
  direction: ltr; margin-bottom: 10px;
}
.fb-legend-item {
  display: flex; align-items: center; gap: 4px;
  font-family: var(--font-py);
  font-size: 10px; color: var(--muted);
}
.fb-legend-dot {
  width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0;
}
.fb-legend-dot.ok   { background: var(--green); }
.fb-legend-dot.near { background: var(--amber); }
.fb-legend-dot.miss { background: var(--rose);  }

/* Tip box */
.fb-tip {
  display: flex; align-items: flex-start; gap: 7px;
  background: rgba(255,255,255,.65);
  border: 1px solid rgba(0,0,0,.05);
  border-radius: 10px; padding: 9px 11px;
  direction: ltr;
}
.fb-tip-icon { font-size: 13px; flex-shrink: 0; margin-top: 1px; }
.fb-tip-text {
  font-family: var(--font-py);
  font-size: 11.5px; color: var(--slate);
  line-height: 1.6;
}
.fb-tip-text strong { color: var(--indigo); font-weight: 600; }

/* ── Next button ────────────────────────────────────────────── */
.next-btn {
  width: 100%;
  display: flex; align-items: center; justify-content: center; gap: 8px;
  padding: 15px 20px;
  background: linear-gradient(135deg, var(--indigo), var(--violet));
  color: #fff;
  border: none; border-radius: 14px;
  font-family: var(--font-ar);
  font-size: 15px; font-weight: 600;
  cursor: pointer;
  box-shadow: 0 6px 18px rgba(99,102,241,.32);
  transition: transform .2s, box-shadow .2s;
}
.next-btn:hover {
  transform: translateY(-1px);
  box-shadow: 0 10px 26px rgba(99,102,241,.4);
}
.next-btn:active { transform: translateY(0); }
.next-btn:disabled {
  background: var(--line); color: var(--muted);
  box-shadow: none; cursor: not-allowed; transform: none;
}
.next-btn svg { width: 17px; height: 17px; }
[dir="rtl"] .next-btn svg { transform: scaleX(-1); }

/* ── Focus ring ─────────────────────────────────────────────── */
button:focus-visible {
  outline: 2.5px solid var(--indigo);
  outline-offset: 3px;
}

/* ── Mobile ─────────────────────────────────────────────────── */
@media (max-width: 380px) {
  .card-body   { padding: 20px 16px 18px; }
  .title       { font-size: 18px; }
  .chinese     { font-size: 32px; }
  .mic-btn     { width: 94px; height: 94px; }
  .mic-btn-icon { font-size: 23px; }
  .fb-score    { font-size: 42px; }
}
@media (min-height: 700px) {
  .card-body { padding: 28px 24px 24px; }
}

</style>
</head>
<body>

<div class="page-wrap">

  <!-- Brand bar -->
  <div class="brand">
    <div class="brand-pulse"></div>
    <span class="brand-name">AI · مدرّب النطق · 发音练习</span>
  </div>

  <!-- Main card -->
  <div class="card">
    <div class="card-stripe"></div>
    <div class="card-body">

      <!-- Header -->
      <div class="header">
        <h1 class="title">تدرّب على نطق الصينية</h1>
        <div class="subtitle">Chinese Pronunciation Trainer</div>
      </div>

      <!-- Progress -->
      <div class="progress" id="progress"></div>

      <!-- Sentence display -->
      <div class="sentence-box" id="sentenceBox">
        <div class="chinese" id="chinese">你好！</div>
        <div class="pinyin"  id="pinyin">nǐ hǎo</div>
        <div class="arabic-meaning" id="meaning">مرحباً</div>
        <div class="hint-row">
          <span class="hint-icon">💡</span>
          <span class="hint-text" id="hintText">
            <strong>好 hǎo</strong> 是第三声，声音要先低再上来。
          </span>
        </div>
      </div>

      <!-- Listen button -->
      <button class="listen-btn" id="listenBtn" onclick="playStandard()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round">
          <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
          <path d="M15.54 8.46a5 5 0 0 1 0 7.07"/>
          <path d="M19.07 4.93a10 10 0 0 1 0 14.14"/>
        </svg>
        <span id="listenLabel">استمع للنطق الصحيح</span>
      </button>

      <!-- Mic section -->
      <div class="mic-section">
        <div class="mic-status">
          <div class="mic-status-ar" id="micStatusAr">اضغط وقل الجملة بصوت واضح</div>
          <div class="mic-status-zh" id="micStatusZh">点击麦克风，然后大声跟读</div>
        </div>
        <div class="soundwave-bar" id="soundwaveBar">

  // ═══════════════════════════════════════════════════════════════
  //  Azure Neural TTS
  //  speakChinese(text, options) — 所有中文朗读的统一入口
  //  优先 Azure XiaoxiaoNeural → 自动 fallback 到浏览器 TTS
  // ═══════════════════════════════════════════════════════════════
  let _azureToken = null, _azureTokenExp = 0, _currentSource = null;

  async function getAzureToken() {
    if (_azureToken && Date.now() < _azureTokenExp) return _azureToken;
    const res = await fetch(
      `https://${AZURE_REGION}.api.cognitive.microsoft.com/sts/v1.0/issueToken`,
      { method: 'POST', headers: { 'Ocp-Apim-Subscription-Key': AZURE_SPEECH_KEY } }
    );
    if (!res.ok) throw new Error(`Token ${res.status}`);
    _azureToken    = await res.text();
    _azureTokenExp = Date.now() + 9 * 60 * 1000;
    return _azureToken;
  }

  function buildSSML(text, rate, pitch) {
    const safe = text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    return `<speak version="1.0" xmlns="http://www.w3.org/2001/10/synthesis"
  xmlns:mstts="http://www.w3.org/2001/mstts" xml:lang="zh-CN">
  <voice name="${AZURE_VOICE}">
    <mstts:express-as style="${AZURE_STYLE}">
      <prosody rate="${rate}" pitch="${pitch}">${safe}</prosody>
    </mstts:express-as>
  </voice>
</speak>`;
  }

  async function speakWithAzure(text, azureRate, azurePitch) {
    const token = await getAzureToken();
    const res   = await fetch(
      `https://${AZURE_REGION}.tts.speech.microsoft.com/cognitiveservices/v1`,
      {
        method : 'POST',
        headers: {
          'Authorization'            : `Bearer ${token}`,
          'Content-Type'             : 'application/ssml+xml',
          'X-Microsoft-OutputFormat' : 'audio-24khz-48kbitrate-mono-mp3',
          'User-Agent'               : 'ChinesePronunciationTrainer'
        },
        body: buildSSML(text, azureRate, azurePitch)
      }
    );
    if (!res.ok) throw new Error(`TTS ${res.status}`);
    const buf    = await res.arrayBuffer();
    const ctx    = new (window.AudioContext || window.webkitAudioContext)();
    const audio  = await ctx.decodeAudioData(buf);
    const source = ctx.createBufferSource();
    source.buffer = audio;
    source.connect(ctx.destination);
    if (_currentSource) { try { _currentSource.stop(); } catch(e){} }
    _currentSource = source;
    return new Promise(resolve => { source.onended = resolve; source.start(0); });
  }


  // ═══════════════════════════════════════════════════════════════
  //  语音引擎 — 统一入口 ttsSpeak()
  //  策略：Azure Neural TTS (如填了 key) → 浏览器 speechSynthesis fallback
  //
  //  常见无声问题已修复：
  //    1. Chrome / iOS 需要"用户手势解锁"后才能播放 → 首次任意点击解锁
  //    2. iOS Safari 在 voices 为空时不会触发 onvoiceschanged
  //       → 不再阻塞等待 voice 列表，直接 speak（系统会按 lang 挑声）
  //    3. Chrome 长句被自动暂停 → resumeTimer 持续 resume
  //    4. 原 speakChinese() 没有走 Azure 分支，等于配置完全失效 → 已修
  //    5. 加上详细 console 日志，便于排查"无声"到底卡在哪一步
  // ═══════════════════════════════════════════════════════════════

  const _hasAzure = !!(AZURE_SPEECH_KEY && AZURE_REGION);

  let _zhVoice     = null;
  let _resumeTimer = null;
  let _ttsUnlocked = false;

  function _pickZhVoice() {
    if (!window.speechSynthesis) return null;
    const all = window.speechSynthesis.getVoices();
    if (!all.length) return null;
    return (
      all.find(v => /xiaoxiao/i.test(v.name))                          ||
      all.find(v => /ting.?ting|meijia|sinji|yating/i.test(v.name))    ||
      all.find(v => v.localService && v.lang === 'zh-CN')              ||
      all.find(v => v.lang === 'zh-CN')                                ||
      all.find(v => v.lang && v.lang.toLowerCase().startsWith('zh'))   ||
      null
    );
  }

  function _refreshVoice() {
    _zhVoice = _pickZhVoice();
    if (_zhVoice) {
      console.log('[TTS] 已选中文语音:', _zhVoice.name, _zhVoice.lang);
    } else if (window.speechSynthesis) {
      const n = window.speechSynthesis.getVoices().length;
      console.warn('[TTS] 未找到中文语音 (voices=' + n + ')，将用 lang=zh-CN 让系统自选');
    }
  }

  if (window.speechSynthesis) {
    window.speechSynthesis.onvoiceschanged = _refreshVoice;
    _refreshVoice();
  } else {
    console.warn('[TTS] 浏览器不支持 speechSynthesis');
  }

  function _startResumeTimer() {
    _stopResumeTimer();
    _resumeTimer = setInterval(() => {
      const s = window.speechSynthesis;
      if (s && s.paused && s.speaking) s.resume();
    }, 400);
  }
  function _stopResumeTimer() {
    if (_resumeTimer) { clearInterval(_resumeTimer); _resumeTimer = null; }
  }

  function ttsStop() {
    _stopResumeTimer();
    if (window.speechSynthesis) {
      try { window.speechSynthesis.cancel(); } catch(e){}
    }
    if (_currentSource) { try { _currentSource.stop(); } catch(e){} _currentSource = null; }
  }

  function _makeUtterance(text, rate) {
    const u = new SpeechSynthesisUtterance(text);
    u.lang   = 'zh-CN';
    u.rate   = rate || 0.9;
    u.pitch  = 1.0;
    u.volume = 1.0;
    if (_zhVoice) u.voice = _zhVoice;
    return u;
  }

  // 按句末标点分段，每段 ≤ 40 字
  function _splitText(text) {
    const segs = [];
    const parts = text.split(/([。！？!?，,、；;：:]+)/);
    let buf = '';
    for (const p of parts) {
      buf += p;
      if (/[。！？!?，,、；;：:]$/.test(buf)) {
        const t = buf.trim();
        if (t) segs.push(t);
        buf = '';
      }
    }
    if (buf.trim()) segs.push(buf.trim());
    const out = [];
    for (const seg of segs) {
      if (seg.length <= 40) out.push(seg);
      else for (let i = 0; i < seg.length; i += 40) out.push(seg.slice(i, i + 40));
    }
    return out.length ? out : [text];
  }

  // —— 浏览器 TTS 串行播放 ——
  function _speakSegsBrowser(segs, rate, onDone) {
    if (!segs.length) { _stopResumeTimer(); if (onDone) onDone(); return; }
    const u = _makeUtterance(segs[0], rate);
    u.onend   = () => _speakSegsBrowser(segs.slice(1), rate, onDone);
    u.onerror = (e) => {
      console.warn('[TTS] utterance error:', e.error || e);
      _speakSegsBrowser(segs.slice(1), rate, onDone);
    };
    try { window.speechSynthesis.speak(u); }
    catch (e) {
      console.warn('[TTS] speak() threw:', e);
      _speakSegsBrowser(segs.slice(1), rate, onDone);
    }
  }

  function _browserSpeak(text, rate, onDone) {
    if (!window.speechSynthesis) {
      console.warn('[TTS] 此环境不支持 speechSynthesis');
      if (onDone) onDone(); return;
    }
    try { window.speechSynthesis.cancel(); } catch(e){}
    _startResumeTimer();
    _speakSegsBrowser(_splitText(text), rate, onDone);
  }

  // —— 用户手势解锁（首次任意点击触发一次静音 utterance）——
  function _unlockTTS() {
    if (_ttsUnlocked || !window.speechSynthesis) return;
    try {
      const u = new SpeechSynthesisUtterance('');
      u.volume = 0; u.lang = 'zh-CN';
      window.speechSynthesis.speak(u);
      _ttsUnlocked = true;
      setTimeout(_refreshVoice, 200);
      console.log('[TTS] 已通过用户手势解锁');
    } catch(e) {
      console.warn('[TTS] unlock failed:', e);
    }
  }
  ['click','touchstart','keydown'].forEach(evt => {
    document.addEventListener(evt, _unlockTTS, { once: true, capture: true });
  });

  // —— 统一入口 ——
  // ttsSpeak(text, rate, onDone)
  //   有 Azure 配置 → 走 Azure；失败自动回退浏览器 TTS
  //   无 Azure 配置 → 直接浏览器 TTS
  function ttsSpeak(text, rate, onDone) {
    if (!text) { if (onDone) onDone(); return; }
    _unlockTTS();

    if (_hasAzure) {
      speakWithAzure(text, AZURE_RATE, AZURE_PITCH)
        .then(() => { if (onDone) onDone(); })
        .catch(err => {
          console.warn('[TTS] Azure 失败，回退浏览器：', err);
          _browserSpeak(text, rate, onDone);
        });
    } else {
      _browserSpeak(text, rate, onDone);
    }
  }

  // 兼容旧别名
  function speakChinese(text, opts) {
    ttsSpeak(text, (opts && opts.browserRate) || 0.9, null);
  }

  // Fallback：浏览器 SpeechRecognition 模拟评分（仅演示用）
  async function assessWithFallback(audioBlob, referenceText) {
    return new Promise(resolve => {
      const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SR) { resolve(makeMockResult(referenceText, '', 0.68 + Math.random() * 0.18)); return; }
      const rec = new SR();
      rec.lang = 'zh-CN'; rec.continuous = false;
      rec.interimResults = false; rec.maxAlternatives = 3;
      rec.onresult = e => {
        resolve(makeMockResult(referenceText, e.results[0][0].transcript.trim(), e.results[0][0].confidence || 0.72));
      };
      rec.onerror = e => {
        if (e.error === 'no-speech')    resolve(null);
        else if (e.error === 'not-allowed') resolve(undefined);
        else resolve(makeMockResult(referenceText, '', 0.5));
      };
      rec.onend = () => {};
      try { rec.start(); recognition = rec; }
      catch(e) { resolve(makeMockResult(referenceText, '', 0.6)); }
    });
  }

  function makeMockResult(referenceText, transcript, confidence) {
    const sim  = calculateSimilarity(transcript, referenceText);
    const base = Math.round(sim * 0.6 + confidence * 100 * 0.4);
    const j    = () => Math.round((Math.random() - 0.5) * 14);
    const cl   = v => Math.min(100, Math.max(0, v));
    const wlf  = Array.from(referenceText).map(hz => {
      const found = transcript.includes(hz);
      const s = found ? cl(base + Math.round(Math.random() * 15)) : cl(base - Math.round(Math.random() * 38));
      return { word: hz, accuracyScore: s, errorType: s >= 80 ? 'None' : s >= 55 ? 'Mispronunciation' : 'Missing' };
    });
    return {
      pronunciationScore: cl(base), accuracyScore: cl(base+j()), fluencyScore: cl(base+j()),
      completenessScore: transcript.length > 0 ? cl(base+j()) : 30, toneScore: cl(base+j()),
      transcript, wordLevelFeedback: wlf, mainSuggestion: null, source: 'fallback',
    };
  }

  function deriveMainSuggestion(words, referenceText) {
    const worst = words.filter(w => w.errorType === 'Mispronunciation' || w.accuracyScore < 60)
                       .sort((a,b) => a.accuracyScore - b.accuracyScore)[0];
    if (!worst) return null;
    const lesson = LESSONS[currentIndex];
    const entry  = lesson?.chars.find(c => c.hz === worst.word);
    if (entry?.tips?.length) return makeSpoken(entry.tips[0], entry.hz);
    return `"${worst.word}"这个字，再听一遍，跟我说。`;
  }

  function calculateSimilarity(a, b) {
    if (!a || !b) return 0;
    if (a === b) return 100;
    const aC = Array.from(a), bC = Array.from(b);
    let matched = 0;
    bC.forEach(c => { if (aC.includes(c)) matched++; });
    const charScore = (matched / bC.length) * 100;
    const lenScore  = (1 - Math.abs(aC.length - bC.length) / Math.max(aC.length, bC.length)) * 100;
    return Math.min(100, charScore * 0.7 + lenScore * 0.3);
  }

  let currentIndex = 0, isRecording = false, isPlaying = false;

  const MIC_STATE = { IDLE: 'idle', LISTENING: 'listening', ANALYZING: 'analyzing', ERROR: 'error' };

  function setMicState(state, errorType) {
    const btn      = document.getElementById('micBtn');
    const icon     = document.getElementById('micBtnIcon');
    const label    = document.getElementById('micBtnLabel');
    const statusAr = document.getElementById('micStatusAr');
    const statusZh = document.getElementById('micStatusZh');
    const wavebar  = document.getElementById('soundwaveBar');
    btn.classList.remove('recording', 'analyzing', 'error');
    switch (state) {
      case MIC_STATE.IDLE:
        icon.textContent = '🎤'; label.textContent = 'قلها الآن · 现在说';
        statusAr.textContent = 'اضغط وقل الجملة بصوت واضح';
        statusZh.textContent = '点击麦克风，然后大声跟读';
        statusAr.style.color = ''; statusZh.style.color = '';
        wavebar.classList.remove('active'); break;
      case MIC_STATE.LISTENING:
        btn.classList.add('recording');
        icon.textContent = '🔴'; label.textContent = 'جارٍ الاستماع…';
        statusAr.textContent = 'أستمع إليك الآن…'; statusZh.textContent = '正在听你说…';
        statusAr.style.color = '#ff6b8a'; statusZh.style.color = '#ff6b8a';
        wavebar.classList.add('active'); break;
      case MIC_STATE.ANALYZING:
        btn.classList.add('analyzing');
        icon.textContent = '⏳'; label.textContent = 'جارٍ التحليل…';
        statusAr.textContent = 'جاري التحليل…'; statusZh.textContent = '正在分析…';
        statusAr.style.color = '#f59e0b'; statusZh.style.color = '#f59e0b';
        wavebar.classList.remove('active'); break;
      case MIC_STATE.ERROR:
        btn.classList.add('error'); icon.textContent = '❗';
        wavebar.classList.remove('active');
        const msgs = {
          'no-speech'  : ['حاول مرة أخرى',    'لم أسمع صوتك، حاول مرة أخرى.',       '没有听到声音，请再试一次。'],
          'not-allowed': ['غير مسموح',         'يرجى السماح باستخدام الميكروفون.',    '请允许浏览器使用麦克风。'],
          'generic'    : ['حاول مرة أخرى',    'حدث خطأ، حاول مجدداً.',               '出错了，请再试一次。'],
        };
        const [l, ar, zh] = msgs[errorType] || msgs['generic'];
        label.textContent = l; statusAr.textContent = ar; statusZh.textContent = zh;
        statusAr.style.color = '#ef4444'; statusZh.style.color = '#ef4444';
        setTimeout(() => setMicState(MIC_STATE.IDLE), 2200); break;
    }
  }

  // ═══════════════════════════════════════════════════════════════
  //  录音控制
  //  Azure 模式  → MediaRecorder → assessPronunciation()
  //  Fallback 模式 → SpeechRecognition → makeMockResult()
  // ═══════════════════════════════════════════════════════════════
  function toggleRecording() {
    if (isPlaying) return;
    isRecording ? stopRecording() : startRecording();
  }

  async function startRecording() {
    isRecording = true;
    setMicState(MIC_STATE.LISTENING);
    document.getElementById('feedbackContent').classList.remove('show');
    document.getElementById('nextBtn').disabled = true;
    const ref = LESSONS[currentIndex].zh;
    if (AZURE_SPEECH_KEY && AZURE_REGION) {
      await startMediaRecorder(ref);
    } else {
      await startFallbackRecognition(ref);
    }
  }

  async function startMediaRecorder(ref) {
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      audioChunks  = [];
      mediaRecorder = new MediaRecorder(stream);
      mediaRecorder.ondataavailable = e => { if (e.data.size > 0) audioChunks.push(e.data); };
      mediaRecorder.onstop = async () => {
        stream.getTracks().forEach(t => t.stop());
        const blob = new Blob(audioChunks, { type: 'audio/webm' });
        setMicState(MIC_STATE.ANALYZING);
        try {
          const result = await assessPronunciation(blob, ref);
          handleAssessmentResult(result);
        } catch(err) { console.error(err); setMicState(MIC_STATE.ERROR, 'generic'); }
      };
      mediaRecorder.start();
      setTimeout(() => { if (mediaRecorder?.state === 'recording') stopRecording(); }, 8000);
    } catch(err) {
      isRecording = false;
      setMicState(MIC_STATE.ERROR, err.name === 'NotAllowedError' ? 'not-allowed' : 'generic');
    }
  }

  async function startFallbackRecognition(ref) {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) { simulatePureMock(ref); return; }
    try {
      recognition = new SR();
      recognition.lang = 'zh-CN'; recognition.continuous = false;
      recognition.interimResults = false; recognition.maxAlternatives = 3;
      recognition.onresult = async e => {
        const t = e.results[0][0].transcript.trim();
        const c = e.results[0][0].confidence || 0.72;
        setMicState(MIC_STATE.ANALYZING);
        const result = makeMockResult(ref, t, c);
        await pause(680);
        handleAssessmentResult(result);
      };
      recognition.onerror = e => {
        isRecording = false;
        if      (e.error === 'no-speech')   setMicState(MIC_STATE.ERROR, 'no-speech');
        else if (e.error === 'not-allowed') setMicState(MIC_STATE.ERROR, 'not-allowed');
        else simulatePureMock(ref);
      };
      recognition.onend = () => {
        isRecording = false;
        const btn = document.getElementById('micBtn');
        if (!btn.classList.contains('analyzing') && !btn.classList.contains('error'))
          setMicState(MIC_STATE.IDLE);
      };
      recognition.start();
    } catch(e) { simulatePureMock(ref); }
  }

  function simulatePureMock(ref) {
    setTimeout(() => {
      setMicState(MIC_STATE.ANALYZING);
      setTimeout(() => {
        handleAssessmentResult(makeMockResult(ref, '', 0.65 + Math.random() * 0.2));
      }, 900);
    }, 2200);
  }

  function stopRecording() {
    try { if (mediaRecorder?.state === 'recording') mediaRecorder.stop(); } catch(e){}
    try { recognition?.stop(); } catch(e){}
    isRecording = false;
  }

  function handleAssessmentResult(result) {
    isRecording = false;
    setMicState(MIC_STATE.IDLE);
    if (result === null)      { setMicState(MIC_STATE.ERROR, 'no-speech');   return; }
    if (result === undefined) { setMicState(MIC_STATE.ERROR, 'not-allowed'); return; }
    showFeedback(result.pronunciationScore, result.transcript, result);
  }

  function showFeedback(score, transcript, result) {
    const card = document.getElementById('feedbackContent');
    card.classList.remove('show', 'excellent', 'good', 'try-again');

    let tier, emoji, praise;
    if      (score >= 85) { tier = 'excellent'; emoji = '🌟'; praise = pickRandom(praiseLines.excellent); }
    else if (score >= 62) { tier = 'good';      emoji = '👍'; praise = pickRandom(praiseLines.good); }
    else                  { tier = 'try-again'; emoji = '💪'; praise = pickRandom(praiseLines.tryAgain); }

    document.getElementById('fbScore').textContent    = score;
    document.getElementById('fbEmoji').textContent    = emoji;
    document.getElementById('fbPraiseZh').textContent = praise.zh;
    document.getElementById('fbPraiseAr').textContent = praise.ar;

    // 逐字反馈：优先使用 Azure wordLevelFeedback，否则模拟
    const lesson = LESSONS[currentIndex];
    const chars  = lesson?.chars || [];
    renderCharFeedback(chars, score, transcript, result?.wordLevelFeedback ?? null);

    // 发音建议：Azure 真实建议 > 本地 LESSONS 库
    let tipHtml = null, tipSpoken = null;
    if (result?.mainSuggestion) {
      tipSpoken = result.mainSuggestion;
      tipHtml   = tipSpoken;
    } else {
      const tip = pickBestTip(chars, score);
      tipHtml   = tip.html;
      tipSpoken = tip.spoken;
    }
    const tipEl = document.getElementById('fbTip');
    if (tipHtml) {
      document.getElementById('fbTipText').innerHTML = tipHtml;
      tipEl.style.display = 'flex';
    } else {
      tipEl.style.display = 'none';
    }

    card.classList.add(tier);
    requestAnimationFrame(() => requestAnimationFrame(() => card.classList.add('show')));
    document.getElementById('nextBtn').disabled = false;

    // 反馈语音：鼓励语说完停顿后说建议
    ttsSpeak(praise.zh, 0.9, () => {
      if (tipSpoken) {
        setTimeout(() => ttsSpeak(tipSpoken, 0.85, null), 500);
      }
    });
  }

  // 逐字颜色块渲染
  // ★ Azure 接入后，wlf 含真实 accuracyScore，优先使用
  function renderCharFeedback(chars, score, transcript, wlf) {
    const container = document.getElementById('fbChars');
    container.innerHTML = '';
    chars.forEach((c, i) => {
      let quality;
      if (wlf && wlf[i]) {
        const s = wlf[i].accuracyScore;
        quality = s >= 80 ? 'ok' : s >= 55 ? 'near' : 'miss';
      } else {
        quality = getCharQuality(c, i, score, transcript);
      }
      const div = document.createElement('div');
      div.className = `fb-char ${quality}`;
      div.style.animationDelay = `${i * 0.07}s`;
      div.innerHTML = `<span class="fb-char-py">${c.py}</span><span class="fb-char-hz">${c.hz}</span>`;
      container.appendChild(div);
    });
  }

  function getCharQuality(charData, index, score, transcript) {
    const recognized = transcript && transcript.includes(charData.hz);
    const base   = score + (recognized ? 8 : -10);
    const jitter = (Math.random() - 0.5) * 20;
    const val    = base + jitter;
    return val >= 80 ? 'ok' : val >= 58 ? 'near' : 'miss';
  }

  function pickBestTip(chars, score) {
    if (score >= 92) return { html: null, spoken: null };
    const container = document.getElementById('fbChars');
    const charEls   = container ? Array.from(container.querySelectorAll('.fb-char')) : [];
    let targetIndex = charEls.findIndex(el => el.classList.contains('miss'));
    if (targetIndex === -1) targetIndex = charEls.findIndex(el => el.classList.contains('near'));
    if (targetIndex === -1 || targetIndex >= chars.length) return { html: null, spoken: null };
    const c = chars[targetIndex];
    if (!c.tips?.length) return { html: null, spoken: null };
    const raw    = pickRandom(c.tips);
    const spoken = makeSpoken(raw, c.hz);
    const html   = raw.replace(
      new RegExp(`(${escReg(c.hz + ' ' + c.py)}|${escReg(c.py + ' ')}|${escReg(c.hz)})`, 'g'),
      '<strong>$1</strong>'
    );
    return { html, spoken };
  }

  function makeSpoken(text, hz) {
    let s = text.replace(/[a-zA-Zāáǎàēéěèīíǐìōóǒòūúǔùǖǘǚǜ]+/g, '').replace(/\s{2,}/g, ' ').trim();
    if (s.replace(/[^\u4e00-\u9fff]/g, '').length < 4) s = `"${hz}"这个字，再听一遍，跟我说。`;
    return s;
  }

  function escReg(s) { return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }
  function pickRandom(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
  function pause(ms) { return new Promise(r => setTimeout(r, ms)); }

  // ═══════════════════════════════════════════════════════════════
  //  导航
  // ═══════════════════════════════════════════════════════════════
  function nextSentence() {
    currentIndex = (currentIndex + 1) % LESSONS.length;
    showSentence();
  }

  // ═══════════════════════════════════════════════════════════════
  //  初始化
  // ═══════════════════════════════════════════════════════════════
  renderProgress();
  showSentence();
  // voices 由顶部 _loadVoices() + onvoiceschanged 自动处理

</script>

</body>
</html>
